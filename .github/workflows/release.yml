name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: build, sign and notarize without publishing a GitHub Release.
  workflow_dispatch:

env:
  # Stable name so releases/latest/download/BingoVoiceGenerator.dmg always resolves.
  DMG_NAME: BingoVoiceGenerator.dmg
  TARGET: aarch64-apple-darwin

permissions:
  contents: write

jobs:
  build-and-release:
    # Developer ID signing and notarization require macOS.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # The tag is the single source of truth for the app version.
      - name: Inject version
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build, sign, notarize and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          # Notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ env.TARGET }}
          # Empty on workflow_dispatch, which makes tauri-action build without publishing.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: Release ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Locate DMG
        id: dmg
        run: |
          DMG_PATH=$(ls src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg | head -1)
          echo "path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG: $DMG_PATH"

      # tauri-action notarizes and staples only the .app; the DMG around it is
      # just signed. Notarize and staple the DMG too so Gatekeeper accepts it
      # offline. The updater .app.tar.gz, its .sig and latest.json are untouched.
      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="${{ steps.dmg.outputs.path }}"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(jq -r '.status' "$RUNNER_TEMP/notary.json")
          if [[ "$STATUS" != "Accepted" ]]; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/notary.json")" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::DMG notarization status: $STATUS"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vv -t open --context context:primary-signature "$DMG_PATH"

      - name: Upload notarized DMGs to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="${{ steps.dmg.outputs.path }}"
          # Replace the versioned DMG tauri-action already uploaded and add the
          # stable-name copy. GitHub turns every character other than letters,
          # digits, "_" and "-" into a dot, then collapses ".." (tauri-action's
          # ghAssetName), so "bingo!! studio_X.dmg" lands as "bingo..studio_X.dmg".
          GH_NAME=$(basename "$DMG_PATH" | sed -E 's/[^a-zA-Z0-9_-]/./g; s/\.\./\./g')
          cp "$DMG_PATH" "$RUNNER_TEMP/$GH_NAME"
          cp "$DMG_PATH" "$RUNNER_TEMP/$DMG_NAME"
          gh release upload "${{ github.ref_name }}" \
            "$RUNNER_TEMP/$GH_NAME" "$RUNNER_TEMP/$DMG_NAME" --clobber

      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bingo-voice-generator-${{ steps.version.outputs.version }}
          path: src-tauri/target/${{ env.TARGET }}/release/bundle/
          retention-days: 7
