[package]
name = "bingo-voice-generator-tauri"
version = "0.1.0"
description = "Generate bingo number audio files using ElevenLabs TTS"
authors = ["Alvaro Murillo del Puerto"]
edition = "2021"

[lib]
name = "bingo_voice_generator_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Keychain access
keyring = { version = "3", features = ["apple-native"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# File paths
dirs = "6"

# Async traits
async-trait = "0.1"

# URL encoding
urlencoding = "2"

# Audio processing for silence trimming
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
mp3lame-encoder = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
