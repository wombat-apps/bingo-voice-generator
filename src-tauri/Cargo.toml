[package]
name = "bingo-voice-generator-tauri"
version = "0.1.0"
description = "Generate bingo number audio files using ElevenLabs TTS"
authors = ["Alvaro Murillo del Puerto"]
edition = "2021"

[lib]
name = "bingo_voice_generator_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Keep the minor version in sync with @tauri-apps/plugin-log in package.json
tauri-plugin-log = "~2.10"

# Logging
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Keychain access (the macOS store is under the target section below)
keyring-core = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# File paths
dirs = "7"

# URL encoding
urlencoding = "2"

# Audio processing for silence trimming
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
mp3lame-encoder = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
